name: tli-store
services:
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
        ports:
            - '127.0.0.1:8000:8000'
            - '127.0.0.1:5173:5173'
        volumes:
            - .:/var/www/html
        depends_on:
            database:
                condition: service_healthy
    database:
        image: postgres:18-bookworm
        environment:
            POSTGRES_DB: ${DB_DATABASE:-tli_store}
            POSTGRES_USER: ${DB_USERNAME:-tli_store}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 3s
            timeout: 3s
            retries: 20
volumes:
    postgres_data:
